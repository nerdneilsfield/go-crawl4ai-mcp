version: 2

project_name: go-crawl4ai-mcp

before:
  hooks:
    - go mod tidy

builds:
  - id: crawl4ai-mcp
    main: ./cmd/crawl4ai-mcp
    binary: crawl4ai-mcp
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: crawl4ai-mcp
    ids: [crawl4ai-mcp]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ title .Os }}_{{ if eq .Arch "amd64" }}x86_64{{ else if eq .Arch "arm64" }}aarch64{{ else }}{{ .Arch }}{{ end }}
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

dockers_v2:
  - id: crawl4ai-mcp
    ids: [crawl4ai-mcp]
    images:
      - ghcr.io/nerdneilsfield/go-crawl4ai-mcp
    tags:
      - "{{ .Version }}"
      - latest
    platforms:
      - linux/amd64
      - linux/arm64
    # GitHub hosted runners use the plain docker buildx driver, which cannot
    # produce attestations; disable SBOM and provenance.
    sbom: false
    flags:
      - "--provenance=false"
    labels:
      org.opencontainers.image.title: "{{.ProjectName}}"
      org.opencontainers.image.version: "{{.Version}}"
      org.opencontainers.image.source: "{{.GitURL}}"
      org.opencontainers.image.revision: "{{.FullCommit}}"

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

# Publish to the nerdneilsfield/homebrew-apps tap and Scoop bucket.
homebrew_casks:
  - name: crawl4ai-mcp
    homepage: https://github.com/nerdneilsfield/go-crawl4ai-mcp
    description: Stateless Streamable HTTP MCP server for Crawl4AI
    binaries:
      - crawl4ai-mcp
    directory: Casks
    repository:
      owner: nerdneilsfield
      name: homebrew-apps
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    hooks:
      post:
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/crawl4ai-mcp"]
          end

scoops:
  - name: crawl4ai-mcp
    homepage: https://github.com/nerdneilsfield/go-crawl4ai-mcp
    description: Stateless Streamable HTTP MCP server for Crawl4AI
    license: MIT
    directory: bucket
    repository:
      owner: nerdneilsfield
      name: homebrew-apps
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
